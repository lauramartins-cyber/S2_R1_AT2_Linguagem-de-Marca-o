
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felps Fisio | Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="pagina">

        <section class="formulario">
            <header class="cabecalho">
                <img src="assets/fisio.png"
                <div class="logo">
                    <div class=></div>
                    <div>
                        <h2>Felps Fisio</h2>
                        <p>FISIOTERAPIA ESPORTIVA</p>
                    </div>
                </div>

                <p class="frase-logo">
                    ESPECIALISTAS EM ATLETAS<br>
                   PERFORMANCE · SAÚDE 
                </p>
            </header>

            <div class="introducao">
                <h1>Cadastro do profissional</h1>
                <p>Preencha seus dados para fazer parte da nossa equipe:</p>
            </div>

            <form action="#" method="post">

                <fieldset>
                    <legend>Informações pessoais</legend>

                    <div class="campo">
                        <label for="nome">Nome completo *</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            pattern="[A-Za-zÀ-ÿ]+( [A-Za-zÀ-ÿ]+)+"
                            title="Digite seu nome e sobrenome."
                            required>
                    </div>

                    <div class="grade">
                        <div class="campo">
                            <label for="cpf">CPF *</label>
                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                placeholder="000.000.000-00"
                                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                                title="Use o formato 000.000.000-00."
                                required>
                        </div>

                        <div class="campo">
                            <label for="email">E-mail *</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="seu@email.com"
                                autocomplete="email"
                                required>
                        </div>

                        <div class="campo">
                            <label for="senha">Senha *</label>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Mínimo de 8 caracteres"
                                minlength="8"
                                pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                                title="Use pelo menos 8 caracteres, incluindo uma letra e um número."
                                autocomplete="new-password"
                                required>
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone *</label>
                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(11) 90000-0000"
                                pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                                title="Use o formato (11) 90000-0000."
                                autocomplete="tel"
                                required>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Registro profissional</legend>

                    <div class="grade">
                        <div class="campo">
                            <label for="conselho">Sigla do conselho *</label>
                            <select id="conselho" name="conselho" required>
                                <option value="">Selecione uma opção</option>
                                <option value="CREFITO">CREFITO</option>
                                <option value="CREF">CREF</option>
                                <option value="CRM">CRM</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="uf">UF do conselho *</label>
                            <select id="uf" name="uf" required>
                                <option value="">Selecione o estado</option>
                                <option value="AC">AC</option>
                                <option value="AL">AL</option>
                                <option value="AP">AP</option>
                                <option value="AM">AM</option>
                                <option value="BA">BA</option>
                                <option value="CE">CE</option>
                                <option value="DF">DF</option>
                                <option value="ES">ES</option>
                                <option value="GO">GO</option>
                                <option value="MA">MA</option>
                                <option value="MT">MT</option>
                                <option value="MS">MS</option>
                                <option value="MG">MG</option>
                                <option value="PA">PA</option>
                                <option value="PB">PB</option>
                                <option value="PR">PR</option>
                                <option value="PE">PE</option>
                                <option value="PI">PI</option>
                                <option value="RJ">RJ</option>
                                <option value="RN">RN</option>
                                <option value="RS">RS</option>
                                <option value="RO">RO</option>
                                <option value="RR">RR</option>
                                <option value="SC">SC</option>
                                <option value="SP">SP</option>
                                <option value="SE">SE</option>
                                <option value="TO">TO</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="numero">Nº do conselho *</label>
                            <input
                                type="text"
                                id="numero"
                                name="numero_conselho"
                                placeholder="Ex.: 123456-F"
                                pattern="[A-Za-z0-9./-]{3,20}"
                                title="Digite de 3 a 20 caracteres."
                                required>
                        </div>

                       
                            <div class="campo">
                            <label for="especialidade">Especialidade *</label>
                            <select id="especialidade" name="especialidade" required>
                            <option value="">Selecione a especialidade</option>
                            <option value="FisioterapiaEsportiva">Fisioterapia Esportiva</option>
                            <option value="ReabilitacaoFisica">Reabilitação Física</option>
                            <option value="FisioterapiaTraumatoOrtopedica">Fisioterapia Traumato-Ortopédica</option>
                            <option value="PrevencaoLesoesEsportivas">Prevenção de Lesões Esportivas</option>
                            <option value="ReabilitacaoPosCirurgica">Reabilitação Pós-Cirúrgica</option>
                            <option value="FisioterapiaMusculoesqueletica">Fisioterapia Musculoesquelética</option>
                            <option value="FisioterapiaDesportiva">Fisioterapia Desportiva</option>
                            <option value="OrtopediaTraumatologia">Ortopedia e Traumatologia</option>
                            <option value="Outra">Outra</option>
                        </select>
                    </div>

                    </div>
                </fieldset>

                <fieldset>
                    <legend>Informações complementares</legend>

                    <div class="campo">
                        <label>Possui experiência com atletas? *</label>

                        <div class="opcoes">
                            <label class="opcao">
                                <input type="radio" name="atende"
                                    value="Sim" required>
                                Sim
                            </label>

                            <label class="opcao">
                                <input type="radio" name="atende"
                                    value="Não">
                                Não
                            </label>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="experiencia">
                            Conte um pouco sobre sua experiência
                        </label>
                        <textarea
                            id="experiencia"
                            name="experiencia"
                            rows="3"
                            placeholder="Escreva aqui (opcional)"></textarea>
                    </div>
                </fieldset>

                <label class="consentimento">
                    <input type="checkbox" name="confirmacao" required>
                    <span>
                        Confirmo que os dados informados são verdadeiros. *
                    </span>
                </label>

                <button type="submit" class="botao">
                    Finalizar cadastro <span>→</span>
                </button>

                <p class="observacao">* Campos obrigatórios.</p>

            </form>
        </section>

</body>
</html>
